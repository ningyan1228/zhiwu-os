services:
  zhiwu-api:
    build: .
    env_file: .env
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: zhiwu-os-api.gjsx.uno
      VIRTUAL_PORT: "8000"
      LETSENCRYPT_HOST: zhiwu-os-api.gjsx.uno
      LETSENCRYPT_EMAIL: gjsxning@163.com
    networks:
      - web

  mail-sync-service:
    build: .
    command: ["python", "-m", "app.mail_sync"]
    env_file: .env
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    external: true
